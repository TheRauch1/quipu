# Tests and builds Quipu.exe on every push and pull request, using the same Docker targets as build.ps1.
# Pushing a tag like v1.2.0 also publishes a GitHub release with Quipu.exe and the third-party notices.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0-ci.${GITHUB_RUN_NUMBER}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Unit tests
        run: docker build --target test .

      - name: Build Quipu.exe
        run: docker build --build-arg VERSION=${{ steps.version.outputs.version }} --target export --output type=local,dest=dist .

      - uses: actions/upload-artifact@v4
        with:
          name: Quipu-${{ steps.version.outputs.version }}
          path: dist/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum Quipu.exe > Quipu.exe.sha256
          gh release create "$GITHUB_REF_NAME" Quipu.exe Quipu.exe.sha256 LICENSE THIRD-PARTY-NOTICES.txt \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
